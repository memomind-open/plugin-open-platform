<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src https://api.open-meteo.com; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <title>City Weather</title>
    <link rel="stylesheet" href="style.css">
    <script src="plugin.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="appbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>Weather</span>
        </div>
        <div class="app-actions">
          <label class="city-picker" for="city">
            <span class="pin" aria-hidden="true"></span>
            <select id="city" aria-label="Select city">
              <option value="beijing">Beijing</option>
              <option value="shanghai">Shanghai</option>
              <option value="shenzhen">Shenzhen</option>
              <option value="hangzhou">Hangzhou</option>
              <option value="chengdu">Chengdu</option>
            </select>
          </label>
          <button id="refresh" class="refresh" type="button" aria-label="Refresh weather">
            <span aria-hidden="true">↻</span>
          </button>
        </div>
      </header>

      <section id="weather-card" class="weather-card" aria-live="polite">
        <div class="placeholder">
          <div class="loading-orb" aria-hidden="true"></div>
          <p>Connecting to the weather service</p>
        </div>
      </section>

      <section class="forecast-section">
        <div class="section-heading">
          <h2>Next three days</h2>
          <span id="updated-at">Updated --:--</span>
        </div>
        <div id="forecast" class="forecast-list">
          <div class="forecast-skeleton"></div>
          <div class="forecast-skeleton"></div>
          <div class="forecast-skeleton"></div>
        </div>
      </section>

      <footer>
        <span id="network-badge" class="badge badge-idle">Preparing</span>
        <span>OPEN-METEO</span>
      </footer>
    </main>
  </body>
</html>
