<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Plugin Studio</title>
    <link rel="stylesheet" href="/studio.css">
    <script type="importmap">
      {
        "imports": {
          "@memomind/gm-plugin-bridge-contract": "/contract/index.js",
          "@memomind/gm-plugin-device-renderer": "/renderer/index.js",
          "@memomind/gm-plugin-studio-runtime": "/runtime/index.js"
        }
      }
    </script>
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">GM WEB PLUGIN SDK</p>
        <h1>Plugin Studio</h1>
      </div>
      <div class="status"><span id="connection-dot"></span><span id="connection-label">Device connected</span></div>
    </header>

    <main>
      <section class="panel plugin-panel">
        <div class="panel-title">
          <div><span>WEB PLUGIN</span><strong>Plugin page</strong></div>
          <button id="reload" class="secondary">Reload</button>
        </div>
        <iframe id="plugin-frame" src="/plugin/index.html" title="Web plugin preview" scrolling="no"></iframe>
      </section>

      <section class="panel device-panel">
        <div class="panel-title">
          <div><span>DEVICE PREVIEW</span><strong>600 × 350 · GRAY_4 → GREEN · 30 Hz</strong></div>
          <span class="fidelity">Fluorescent green monochrome preview</span>
        </div>
        <div class="transport-bar">
          <span>BT Scene packet ≤ 81,901 B · Channel 6 raw image / Channel 7 raw LZ4</span>
          <strong id="transport-status">Waiting for a draw request</strong>
        </div>
        <div class="glasses-view">
          <div class="device-shell">
            <canvas id="device-canvas" aria-label="Virtual glasses display"></canvas>
          </div>
        </div>
        <div class="controls">
          <div class="control-group">
            <label>Head gestures</label>
            <div class="gesture-grid">
              <button data-gesture="headRaise">Look up <kbd>↑</kbd></button>
              <button data-gesture="left">Turn left <kbd>←</kbd></button>
              <button data-gesture="headLower">Look down <kbd>↓</kbd></button>
              <button data-gesture="right">Turn right <kbd>→</kbd></button>
            </div>
          </div>
          <div class="control-group">
            <label>Device button</label>
            <div class="button-row">
              <button data-button="single">Single click</button>
              <button data-button="double">Double click</button>
              <button data-button="long">Long press</button>
            </div>
          </div>
          <div class="control-group compact">
            <label for="lifecycle">Lifecycle</label>
            <select id="lifecycle">
              <option value="running">running</option>
              <option value="suspended">suspended</option>
              <option value="stopped">stopped</option>
              <option value="failed">failed</option>
            </select>
            <label class="switch"><input id="connected" type="checkbox" checked><span>Connect device</span></label>
            <button id="clear" class="secondary">Clear display</button>
          </div>
        </div>
      </section>

      <section class="panel log-panel">
        <div class="panel-title">
          <div><span>BRIDGE INSPECTOR</span><strong>Requests and events</strong></div>
          <button id="clear-log" class="secondary">Clear log</button>
        </div>
        <ol id="logs"></ol>
      </section>
    </main>

    <script type="module" src="/studio.js"></script>
  </body>
</html>
