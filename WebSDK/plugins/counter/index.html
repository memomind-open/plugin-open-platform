<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'">
  <title>Memo Plugin Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p class="badge">TRUSTED LOCAL DEBUG ASSET</p>
    <h1>Plugin Runtime Demo</h1>
    <p id="runtime">等待 App 注入 Bridge…</p>
    <div class="counter"><span id="counter">0</span><small>运行秒数</small></div>
    <div class="actions">
      <button id="subscribe">订阅设备事件</button>
      <button id="persist">保存计数</button>
      <button id="draw">绘制到设备</button>
    </div>
    <pre id="log"></pre>
  </main>
  <script src="plugin.js"></script>
</body>
</html>
